services:
  icecast:
    image: moul/icecast:latest
    container_name: hdradio-icecast
    restart: unless-stopped
    environment:
      - ICECAST_SOURCE_PASSWORD=nrsc5_internal
      - ICECAST_ADMIN_PASSWORD=nrsc5_internal
      - ICECAST_RELAY_PASSWORD=nrsc5_internal
      - ICECAST_PASSWORD=nrsc5_internal
      - ICECAST_HOSTNAME=localhost
    command:
      - sh
      - -c
      - "sed -i 's|<port>8000</port>|<port>8750</port>|g' /etc/icecast2/icecast.xml && /start.sh"
    ports:
      - "${ICECAST_PORT:-8750}:8750"

  tuner:
    image: ghcr.io/ryanchild/nrsc5-esp32-controller:latest
    container_name: hdradio-tuner
    init: true
    restart: unless-stopped
    privileged: true
    depends_on:
      - icecast
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data:/data
    environment:
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8750
      - ICECAST_SOURCE_PASSWORD=nrsc5_internal
      - ICECAST_MOUNT=${ICECAST_MOUNT:-/hdradio}
      - MP3_BITRATE=${MP3_BITRATE:-192k}
      - DEFAULT_FREQ=${DEFAULT_FREQ:-90.3}
      - DEFAULT_PROGRAM=${DEFAULT_PROGRAM:-0}
      - RTL_GAIN=${RTL_GAIN:-}
      - RTL_PPM=${RTL_PPM:-}
      - RTL_DEVICE_INDEX=${RTL_DEVICE_INDEX:-0}
      - API_PORT=${API_PORT:-8751}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - STATE_FILE=/data/state.json
    ports:
      - "${API_PORT:-8751}:${API_PORT:-8751}"
